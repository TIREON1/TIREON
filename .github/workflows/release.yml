name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        name: Build signed release APK
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Verify Gradle wrapper
              run: |
                  if [ ! -f gradlew ]; then
                    echo "::error::gradlew가 없습니다. Android Gradle 프로젝트를 먼저 추가하세요."
                    exit 1
                  fi
                  chmod +x gradlew

            - name: Set up JDK 21
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Decode release keystore
              env:
                  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
              run: |
                  if [ -z "$KEYSTORE_BASE64" ]; then
                    echo "::error::KEYSTORE_BASE64 secret이 설정되지 않았습니다."
                    exit 1
                  fi
                  printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

            - name: Create keystore.properties
              env:
                  KEYSTORE_PATH: ${{ runner.temp }}/release.jks
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
                    echo "::error::KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD secret을 설정하세요."
                    exit 1
                  fi
                  {
                    echo "storeFile=$KEYSTORE_PATH"
                    echo "storePassword=$KEYSTORE_PASSWORD"
                    echo "keyAlias=$KEY_ALIAS"
                    echo "keyPassword=$KEY_PASSWORD"
                  } > keystore.properties

            - name: Build release APK
              run: ./gradlew assembleRelease --stacktrace

            - name: Locate APK
              id: apk
              run: |
                  APK_PATH=$(find . -path '*/build/outputs/apk/release/*.apk' -type f | head -n 1)
                  if [ -z "$APK_PATH" ]; then
                    echo "::error::release APK를 찾지 못했습니다."
                    exit 1
                  fi
                  echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
                  echo "name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"

            - name: Verify signature
              run: |
                  SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
                  APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
                  if [ -z "$APKSIGNER" ]; then
                    echo "::warning::apksigner를 찾지 못해 서명 검증을 건너뜁니다."
                    exit 0
                  fi
                  "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"

            - name: Prepare submission APK
              run: |
                  mkdir -p apk
                  cp "${{ steps.apk.outputs.path }}" apk/TIREON_release.apk

            - name: Upload APK artifact
              uses: actions/upload-artifact@v7
              with:
                  name: release-apk
                  path: apk/TIREON_release.apk
                  if-no-files-found: error

            - name: Create GitHub Release
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG" \
                    "apk/TIREON_release.apk#TIREON release APK" \
                    --title "$TAG" \
                    --generate-notes

            - name: Write summary
              run: |
                  {
                    echo "### Release APK"
                    echo ""
                    echo "- 파일: \`apk/TIREON_release.apk\`"
                    echo "- SHA-256: \`$(sha256sum apk/TIREON_release.apk | cut -d' ' -f1)\`"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Clean up signing material
              if: always()
              run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
